<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eigo DE Quest - Base System & Debugger</title>
    <style>
        /* ==========================================================================
           1. コア・レイヤー設計（CSS）
           ========================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
        }

        /* ゲーム画面全体のコンテナ */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1024px; /* タブレット・PC想定の最大幅 */
            margin: 0 auto;
            overflow: hidden;
        }

        /* 背景レイヤー：最背面(z-index: 1)に配置し、絶対に画面全体を覆う */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            transition: background-image 0.5s ease-in-out;
            /* 開発時デバッグ用： border: 5px solid red !important; */
        }

        /* エフェクトレイヤー：背景のすぐ上、キャラクターの下 (z-index: 2) */
        #effect-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none; /* 下位レイヤーのクリックを阻害しない */
        }

        /* スクリーン共通：背景の上に重なるUI空間 (z-index: 3) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: none;
            /* 背景を透過させるための絶対条件 */
            background: transparent !important; 
        }

        /* アクティブなスクリーンのみ表示 */
        .screen.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* ==========================================================================
           2. UI/UX コンポーネントスタイル
           ========================================================================== */
        /* 音声認識インジケーター */
        #listening-indicator {
            display: none;
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 0, 0, 0.85);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            animation: pulse 1s infinite alternate;
            z-index: 10;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* メインテキストボックス（ピコガイド・あなたの声など） */
        .textbox {
            width: 90%;
            background: rgba(0, 0, 0, 0.75);
            border: 3px solid #fff;
            border-radius: 10px;
            color: #fff;
            padding: 15px;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            z-index: 4;
        }

        .user-voice-box {
            color: #5fffa3; /* ユーザーの発話テキストは緑系で差別化 */
            font-weight: bold;
        }

        /* 汎用ボタン */
        .btn {
            background: linear-gradient(135deg, #ff9900, #ff5500);
            border: 2px solid #fff;
            border-radius: 25px;
            color: #fff;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="bg-layer" class="bg-layer"></div>
    <div id="effect-layer"></div>

    <div id="listening-indicator">🔴 音声認識中（LISTENING...）</div>

    <div id="screen-title" class="screen active">
        <div style="margin-top: auto; text-align: center; color: white;">
            <h1 style="font-size: 2.5rem; text-shadow: 2px 2px 4px #000; margin-bottom: 20px;">Eigo DE Quest</h1>
            <p style="margin-bottom: 40px;">〜英語を話すことで世界を動かすRPG〜</p>
        </div>
        <div style="margin-bottom: auto;">
            <button class="btn" onclick="startGameContent()">ゲームスタート</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <div class="textbox" id="pico-guide-box">
            ピコ：「マスター！冒険の準備はいいピコ？」
        </div>
        
        <div class="textbox user-voice-box" id="user-voice-box" style="display: none;">
            あなたの声：(ここに認識されたテキストが表示されます)
        </div>

        <div style="margin-bottom: 20px; display: flex; gap: 10px;">
            <button class="btn" onclick="testTriggerSpeech()">マイクテスト発火</button>
            <button class="btn" style="background: #555;" onclick="runDiagnostics()">描画デバッグ実行</button>
        </div>
    </div>
</div>

<script>
    // グローバルゲーム状態管理
    const gameState = {
        currentSceneIndex: 0,
        monstersData: null,
        isLoaded: false
    };

    // 初期化処理
    window.addEventListener('DOMContentLoaded', async () => {
        console.log("【System】Base System Initialized.");
        // モンスター図鑑データの非同期読み込みを実行
        await loadMonstersJSON();
    });

    /**
     * 5. モンスター図鑑データ (monsters.json) を非同期でプリロード
     */
    async function loadMonstersJSON() {
        try {
            // Version3階層ルールに基づき、/data/monsters.json からロード
            const response = await fetch('data/monsters.json');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            gameState.monstersData = await response.json();
            gameState.isLoaded = true;
            console.log("【System】monsters.json を正常にロードしました。総数:", gameState.monstersData.length);
            console.log("【Data Sample】ID 01 Target:", gameState.monstersData[0].target_category);
        } catch (error) {
            console.error("【Error】monsters.json の読み込みに失敗しました。パス設定（/data/monsters.json）を確認してください。:", error);
            // 開発用フェイルセーフ：通信エラー時も動作が止まらないよう空配列を代入
            gameState.monstersData = [];
        }
    }

    /**
     * ① タイトルからゲーム画面への遷移
     */
    function startGameContent() {
        console.log("【Router】startGameContent() triggered.");
        showScreen('screen-game');
        runSceneRouter();
    }

    /**
     * 画面切り替えロジック
     */
    function showScreen(screenId) {
        // 全スクリーンを非アクティブ化
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        // 指定したスクリーンをアクティブ化
        const targetScreen = document.getElementById(screenId);
        if (targetScreen) {
            targetScreen.classList.add('active');
            console.log(`【UI】Screen switched to: ${screenId}`);
        }
    }

    /**
     * シラウタRouter（ストーリー展開のコア）
     */
    function runSceneRouter() {
        console.log("【Router】runSceneRouter() active. Index:", gameState.currentSceneIndex);
        
        // 背景画像の強制割当テスト（Version3のパス規則に準拠）
        const bgLayer = document.getElementById("bg-layer");
        bgLayer.style.backgroundImage = "url('images/backgrounds/morning_01.png')";
        
        console.log("【Render】bg-layer.style.backgroundImage に画像をセットしました。");
    }

    /**
     * 3. UI/UX仕様に基づく 音声認識モックテスト関数
     */
    function testTriggerSpeech() {
        const indicator = document.getElementById('listening-indicator');
        const voiceBox = document.getElementById('user-voice-box');
        const picoBox = document.getElementById('pico-guide-box');

        // 🔴 認識中インジケーターの明示 (recognition.onstart 擬似)
        indicator.style.display = 'block';
        picoBox.innerText = "ピコ：「知っている『果物』の名前を言ってあげよう！1つずつ、ゆっくりね！」";
        
        // 3.5秒のポーズ時間および発話待ちをシミュレート（1.5秒後に結果表示）
        setTimeout(() => {
            // 認識終了に伴うインジケーター消去 (recognition.onend 擬似)
            indicator.style.display = 'none';
            
            // 大掃除ロジック通過後のテキスト（toLowerCase想定）
            const mockRecognizedText = "apple"; 
            
            voiceBox.style.display = 'block';
            voiceBox.innerText = `あなたの声：${mockRecognizedText}`;
            
            // 合否フィードバックの提示
            picoBox.innerHTML = "✅ <strong>Great!</strong><br>フルーツ・モンスター：「ウマウマ！(Smile)」";
        }, 1500);
    }

    /**
     * ④〜⑦ 原因究明用：自動診断（Diagnostics）スクリプト
     * ブラウザのコンソールに現在のDOM状態を詳細に出力します。
     */
    function runDiagnostics() {
        console.log("======================================");
        console.log("👑 【Eigo DE Quest】描画レイヤー自動診断");
        console.log("======================================");

        const bgLayer = document.getElementById('bg-layer');
        if (!bgLayer) {
            console.error("❌ 診断結果：#bg-layer がDOM上に存在しません！");
            return;
        }

        // 検証ポイント①：style属性の直接確認
        const inlineBg = bgLayer.style.backgroundImage;
        console.log("【④ 検証】style.backgroundImage (インライン値):", inlineBg || "空っぽ（設定されていません）");

        // 検証ポイント②：計算された最終スタイルの確認
        const computedBg = getComputedStyle(bgLayer).backgroundImage;
        console.log("【⑥ 検証】getComputedStyle.backgroundImage (最終適用値):", computedBg);

        // 検証ポイント③：レイヤーのサイズ（BoundingClientRect）確認
        const rect = bgLayer.getBoundingClientRect();
        console.log(`【⑥ 検証】サイズ確認 -> 幅: ${rect.width}px, 高さ: ${rect.height}px`);
        if (rect.width === 0 || rect.height === 0) {
            console.warn("⚠️ 警告：#bg-layer のサイズが0になっています。CSSの絶対配置(absolute/top/left)を確認してください。");
        }

        // 検証ポイント④：スクリーンの背景色確認（遮蔽問題の特定）
        const gameScreen = document.getElementById('screen-game');
        if (gameScreen) {
            const screenBg = getComputedStyle(gameScreen).backgroundColor;
            console.log("【⑤ 検証】#screen-game の背景色:", screenBg);
            if (screenBg !== "rgba(0, 0, 0, 0)" && screenBg !== "transparent") {
                console.warn("⚠️ 警告：ゲームスクリーン自体に背景色が設定されているため、後ろの背景レイヤーが隠れている可能性があります！");
            }
        }
        console.log("======================================");
    }
</script>

</body>
</html>
